version: 10

systems:
  - name: local-notes
    description: Private working notes and drafts.
    embedder: lmstudio:nomic
    database: managed:local
    mirrors: []

embedders:
  - id: lmstudio:nomic
    provider_kind: lmstudio
    api_style: openai
    model: text-embedding-nomic-embed-text-v1.5
    revision: "1"
    max_tokens: 8192
    recommended_chunk_size: 500
    token_counter: estimate
    token_safety_margin: 0.8
    api_key_env: null

databases:
  - id: managed:local
    kind: managed-postgres

settings:
  default_system: local-notes
